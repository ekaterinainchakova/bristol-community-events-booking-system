{% extends "base.html" %}
{% block title %}Log in | BCE{% endblock %}
{% block content %}
<div class="auth-wrap">
<div class="auth-card">
    <h2>Log in</h2>
    <p class="auth-subtitle">Welcome back to Bristol Community Events</p>
    <form method="POST">
        <div class="form-group">
            <label for="email">Email address <span class="required">*</span></label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label for="password">Password <span class="required">*</span></label>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Your password">
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">Log in</button>
    </form>
    <p style="text-align:center;margin-top:1.5rem;font-size:0.875rem;color:var(--gray-400);">
        No account yet? <a href="{{ url_for('register') }}">Register here</a>
    </p>
</div>
</div>
{% endblock %}
