{% extends "base.html" %}
{% block title %}Change Password | BCE{% endblock %}
{% block content %}
<div class="auth-wrap">
<div class="auth-card">
    <h2>Change password</h2>
    <p class="auth-subtitle">Choose a strong, unique password</p>
    <form method="POST">
        <div class="form-group">
            <label for="old_password">Current password <span class="required">*</span></label>
            <input type="password" id="old_password" name="old_password" required>
        </div>
        <div class="form-group">
            <label for="new_password">New password <span class="required">*</span></label>
            <input type="password" id="new_password" name="new_password" required minlength="6">
        </div>
        <div class="form-group">
            <label for="confirm_new_password">Confirm new password <span class="required">*</span></label>
            <input type="password" id="confirm_new_password" name="confirm_new_password" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update password</button>
            <a href="{{ url_for('home') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</div>
{% endblock %}
