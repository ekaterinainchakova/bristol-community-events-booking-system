{% extends "base.html" %}
{% block title %}Register | BCE{% endblock %}
{% block content %}
<div class="auth-wrap">
<div class="auth-card">
    <h2>Create account</h2>
    <p class="auth-subtitle">Join Bristol Community Events</p>
    <form method="POST">
        <div class="form-group">
            <label for="full_name">Full name <span class="required">*</span></label>
            <input type="text" id="full_name" name="full_name" required maxlength="100" placeholder="Jane Smith">
        </div>
        <div class="form-group">
            <label for="email">Email address <span class="required">*</span></label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" maxlength="20" placeholder="+44 7700 000000">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="password">Password <span class="required">*</span></label>
                <input type="password" id="password" name="password" required minlength="6" placeholder="Min. 6 characters">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm password <span class="required">*</span></label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Repeat password">
            </div>
        </div>
        <div class="form-group form-check">
            <input type="checkbox" id="is_student" name="is_student">
            <label for="is_student">I am a student (10% discount &mdash; ID required at event)</label>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:0.5rem;">Create account</button>
    </form>
    <p style="text-align:center;margin-top:1.5rem;font-size:0.875rem;color:var(--gray-400);">
        Already registered? <a href="{{ url_for('login') }}">Log in</a>
    </p>
</div>
</div>
{% endblock %}
