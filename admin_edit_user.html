{% extends "base.html" %}
{% block title %}Edit User | BCE Admin{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <h2>✏️ Edit User</h2>
        <p style="color:var(--text-muted);margin-bottom:1.5rem;">User ID: #{{ user.UserID }}</p>

        <form method="POST">
            <div class="form-group">
                <label for="full_name">Full Name <span class="required">*</span></label>
                <input type="text" id="full_name" name="full_name"
                       value="{{ user.FullName }}" required maxlength="100"
                       placeholder="Full name">
            </div>

            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email"
                       value="{{ user.Email }}" required maxlength="150"
                       placeholder="email@example.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone"
                       value="{{ user.Phone or '' }}" maxlength="20"
                       placeholder="+44 7700 000000">
            </div>

            <div class="form-group">
                <label for="role_id">Role <span class="required">*</span></label>
                <select id="role_id" name="role_id" required>
                    {% for role in roles %}
                    <option value="{{ role.RoleID }}"
                        {% if role.RoleID == user.RoleID %}selected{% endif %}>
                        {{ role.RoleName }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group form-check">
                <label>
                    <input type="checkbox" name="is_student"
                           {% if user.IsStudent %}checked{% endif %}>
                    Is Student (10% discount applies)
                </label>
            </div>

            <div style="display:flex;gap:1rem;margin-top:1.5rem;">
                <button type="submit" class="btn-primary-full">💾 Save Changes</button>
                <a href="{{ url_for('admin_users') }}" class="btn-secondary-full">Cancel</a>
            </div>
        </form>
    </div>
</div>

<style>
.form-page { display:flex; justify-content:center; padding: 2rem 1rem; }
.form-card { background: var(--bg-card); border-radius: var(--radius-xl); padding: 2.5rem; width: 100%; max-width: 520px; box-shadow: var(--shadow-lg); }
.form-group { margin-bottom: 1.25rem; }
.form-group label { display:block; font-weight:600; margin-bottom:0.4rem; color:var(--text-dark); }
.form-group input, .form-group select {
    width:100%; padding:0.65rem 0.9rem;
    border:1.5px solid var(--border-light); border-radius:var(--radius-md);
    font-size:1rem; transition: border-color var(--transition-fast);
}
.form-group input:focus, .form-group select:focus {
    outline:none; border-color:var(--primary);
}
.form-check label { display:flex; align-items:center; gap:0.5rem; cursor:pointer; font-weight:500; }
.form-check input { width:auto; }
.required { color:var(--danger); }
.btn-primary-full { background:var(--primary); color:white; border:none; padding:0.75rem 1.5rem; border-radius:var(--radius-md); cursor:pointer; font-weight:600; font-size:1rem; }
.btn-primary-full:hover { background:var(--primary-dark); }
.btn-secondary-full { background:#e2e8f0; color:var(--text-dark); padding:0.75rem 1.5rem; border-radius:var(--radius-md); text-decoration:none; font-weight:600; font-size:1rem; display:inline-block; }
</style>
{% endblock %}
