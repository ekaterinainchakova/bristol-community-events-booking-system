{% extends "base.html" %}
{% block title %}Edit Event | BCE Admin{% endblock %}
{% block content %}

<div class="admin-page-header">
    <h2>Edit Event</h2>
    <a href="{{ url_for('admin_events') }}" class="btn btn-secondary">Back to events</a>
</div>

<div class="form-page">
<div class="form-page-card">
    <p class="form-page-subtitle">Event ID: #{{ event.EventID }}</p>
    <form method="POST" enctype="multipart/form-data">

        <div class="form-group">
            <label for="event_name">Event name <span class="required">*</span></label>
            <input type="text" id="event_name" name="event_name"
                   value="{{ event.EventName }}" required maxlength="200">
        </div>

        <div class="form-group">
            <label for="description">Description <span class="required">*</span></label>
            <textarea id="description" name="description" rows="4" required>{{ event.Description }}</textarea>
        </div>

        <div class="form-group">
            <label for="vec_id">Venue &amp; Category <span class="required">*</span></label>
            <select id="vec_id" name="vec_id" required>
                {% for opt in venue_category_options %}
                <option value="{{ opt.VenuesEventCategoriesID }}"
                    {% if opt.VenuesEventCategoriesID == event.VenuesEventCategoriesID %}selected{% endif %}>
                    {{ opt.VenueName }} — {{ opt.CategoryName }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="start_date">Start date <span class="required">*</span></label>
                <input type="date" id="start_date" name="start_date"
                       value="{{ event.StartDate }}" required>
            </div>
            <div class="form-group">
                <label for="end_date">End date <span class="required">*</span></label>
                <input type="date" id="end_date" name="end_date"
                       value="{{ event.EndDate }}" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="booking_deadline">Booking deadline <span class="required">*</span></label>
                <input type="date" id="booking_deadline" name="booking_deadline"
                       value="{{ event.BookingDeadline }}" required>
            </div>
            <div class="form-group">
                <label for="max_tickets">Max tickets <span class="required">*</span></label>
                <input type="number" id="max_tickets" name="max_tickets"
                       value="{{ event.MaxTickets }}" min="1" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="base_price">Base price (&pound;)</label>
                <input type="number" id="base_price" name="base_price"
                       value="{{ event.BasePrice }}" min="0" step="0.01"
                       {% if event.IsFree %}disabled{% endif %}>
            </div>
            <div class="form-group" style="display:flex;align-items:flex-end;padding-bottom:0.25rem;">
                <div class="form-check">
                    <input type="checkbox" id="is_free" name="is_free"
                           {% if event.IsFree %}checked{% endif %}
                           onchange="document.getElementById('base_price').disabled=this.checked;">
                    <label for="is_free">Free event</label>
                </div>
            </div>
        </div>

        
        {% if event.ImageURL %}
        <div class="form-group">
            <label>Current image</label>
            <img src="{{ url_for('static', filename='images/' + event.ImageURL) }}"
                 alt="Current image"
                 style="max-height:140px;border-radius:var(--r-lg);border:1px solid var(--gray-200);margin-bottom:0.5rem;">
            <div class="form-check">
                <input type="checkbox" id="remove_image" name="remove_image">
                <label for="remove_image">Remove current image</label>
            </div>
        </div>
        {% endif %}

        <div class="form-group">
            <label for="event_image">Replace image</label>
            <input type="file" id="event_image" name="event_image"
                   accept=".jpg,.jpeg,.png,.gif,.webp,.avif">
            <p class="form-help">Max 5 MB. Leave blank to keep current image.</p>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a href="{{ url_for('admin_events') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</div>
{% endblock %}
